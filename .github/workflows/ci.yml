name: Foundation checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  coordination:
    name: Coordination gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      foundation: ${{ steps.scope.outputs.foundation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --test tests/coordination/*.test.mjs
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node scripts/check-coordination.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_BRANCH"
      - name: Backlog done proof (read only, fail closed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/autopilot/check-done-proof.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
  verify:
    name: Foundation verification
    needs: coordination
    if: needs.coordination.outputs.foundation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      identity-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lf025_identity_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Identity integration (disposable PostgreSQL, no real credentials)
        env:
          IDENTITY_TEST_ADMIN_URL: postgres://postgres@127.0.0.1:5432/lf025_identity_test
        run: npx --no-install vitest run --config vitest.identity.config.ts
      - run: npm run build
      - name: Commercial integration (isolated PostgreSQL database)
        env:
          LEADS_TEST_ADMIN_URL: postgres://postgres@127.0.0.1:5432/lf026_leads_test
        run: npx --no-install vitest run --config vitest.leads.config.ts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Real identity browser flow (ephemeral secret)
        env:
          DATABASE_URL: postgres://lf025_test_runtime@127.0.0.1:5432/lf025_identity_test
          APP_ORIGIN: http://127.0.0.1:4310
        shell: bash
        run: |
          export AUTH_SECRET="$(node -p "require('node:crypto').randomBytes(32).toString('hex')")"
          echo "::add-mask::$AUTH_SECRET"
          npx --no-install playwright test --config playwright.identity.config.ts
      - name: Real leads and pipeline browser flow (ephemeral secret)
        env:
          DATABASE_URL: postgres://lf026_test_runtime@127.0.0.1:5432/lf026_leads_test
          APP_ORIGIN: http://127.0.0.1:4311
        shell: bash
        run: |
          export AUTH_SECRET="$(node -p "require('node:crypto').randomBytes(32).toString('hex')")"
          echo "::add-mask::$AUTH_SECRET"
          npx --no-install playwright test --config playwright.leads.config.ts
