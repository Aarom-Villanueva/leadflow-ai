name: Foundation checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  coordination:
    name: Coordination gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      foundation: ${{ steps.scope.outputs.foundation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --test tests/coordination/*.test.mjs
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node scripts/check-coordination.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_BRANCH"
      - name: Backlog done proof (read only, fail closed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/autopilot/check-done-proof.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
  verify:
    name: Foundation verification
    needs: coordination
    if: needs.coordination.outputs.foundation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
